{% extends "layout.html" %}
{% block title %}Edit — {{ recipe.title }} {% endblock %}

{% block content %}
<div class="container" style="max-width: 680px;">

  <div style="margin-bottom:1rem;">
    <a href="{{ url_for('recipe_detail', recipe_id=recipe.id) }}" class="btn btn-secondary">← Cancel</a>
  </div>

  <h1 class="page-title">Edit Recipe</h1>
  <p class="page-subtitle">Make changes below and save when you're done.</p>

  <form action="{{ url_for('edit_recipe', recipe_id=recipe.id) }}" method="POST">
    <div style="margin-bottom:1rem;">
      <label style="font-weight:700; display:block; margin-bottom:4px;">Title</label>
      <input type="text" name="title" value="{{ recipe.title }}" required />
    </div>

    <div style="margin-bottom:1rem;">
      <label style="font-weight:700; display:block; margin-bottom:4px;">
        Ingredients <span style="font-weight:400; color:var(--text-muted);">(one per line)</span>
      </label>
      <textarea name="ingredients" rows="10" style="resize:vertical;">{{ recipe.ingredients }}</textarea>
    </div>

    <div style="margin-bottom:1.5rem;">
      <label style="font-weight:700; display:block; margin-bottom:4px;">Instructions</label>
      <textarea name="instructions" rows="12" style="resize:vertical;">{{ recipe.instructions }}</textarea>
    </div>

    <div style="display:flex; gap:0.75rem;">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{{ url_for('recipe_detail', recipe_id=recipe.id) }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
